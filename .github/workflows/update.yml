name: Update Kindle Dashboard

on:
  schedule:
    # 每日自動執行兩次 (UTC 時間 0 點同 12 點，即香港時間朝早 8 點同夜晚 8 點)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow requests

    - name: Run dashboard generator
      run: |
        python render_dashboard.py

    - name: Commit and push updated dashboard.png
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add dashboard.png
        git commit -m "Auto-update dashboard.png [skip ci]" || exit 0
        git push
